server {
    listen 80;
    server_name sanctificare.app www.sanctificare.app;
    
    # Redirecionar todo tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sanctificare.app www.sanctificare.app;

    # Certificados SSL (Gerenciados pelo Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/sanctificare.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sanctificare.app/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Compressão para reduzir payload em redes móveis.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf
        application/vnd.ms-fontobject;

    # Assets versionados com hash (Vite) servidos diretamente do filesystem com cache imutável
    location ^~ /assets/ {
        root /var/www/sanctificare/dist/public;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri @proxy;
    }

    # Outros arquivos estáticos genéricos (imagens, ícones e fontes fora de /assets/)
    location ~* \.(?:js|mjs|css|svg|ico|png|jpg|jpeg|webp|avif|woff|woff2|ttf|otf)$ {
        root /var/www/sanctificare/dist/public;
        expires 1d;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri @proxy;
    }

    # Garante barra final para WordPress em subpasta.
    location = /blog {
        return 301 /blog/;
    }

    # WordPress servido em /blog a partir de /var/www/wordpress.
    # O ^~ impede que os regex genéricos (assets do app) capturem essas rotas.
    location ^~ /blog/ {
        root /var/www/wordpress;
        index index.php index.html index.htm;

        # Remove o prefixo /blog antes de resolver arquivos no filesystem.
        rewrite ^/blog/(.*)$ /$1 break;
        try_files $uri $uri/ /index.php?$args;

        # Processa PHP do WordPress dentro de /blog.
        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            include fastcgi_params;
        }
    }

    # Endurecimento de segurança para o WordPress
    location = /blog/wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueia execução de scripts PHP na pasta de uploads (vetor comum de RCE)
    location ~* /blog/wp-content/uploads/.*\.php$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Bloqueia XML-RPC para mitigar ataques de força bruta e amplificação DoS
    location = /blog/xmlrpc.php {
        deny all;
        access_log off;
        log_not_found off;
    }

    # HTML não deve ficar preso em cache para evitar servir index antigo.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache" always;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
