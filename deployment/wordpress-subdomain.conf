server {
    listen 80;
    server_name blog.sanctificare.app;

    # Redirecionar tráfego HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name blog.sanctificare.app;

    # Certificados SSL (Gerenciados pelo Let's Encrypt / Certbot)
    # IMPORTANTE: Garanta que rodou o certbot para gerar estes arquivos antes de ativar o SSL
    ssl_certificate /etc/letsencrypt/live/blog.sanctificare.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blog.sanctificare.app/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Pasta raiz onde os arquivos do WordPress serão instalados
    root /var/www/wordpress;
    index index.php index.html index.htm;

    # Configuração de Logs
    access_log /var/log/nginx/wordpress_access.log;
    error_log /var/log/nginx/wordpress_error.log;

    # Compressão Gzip
    gzip on;
    gzip_types text/css text/javascript text/xml text/plain text/x-component application/javascript application/x-javascript application/json application/xml application/rss+xml application/vnd.ms-fontobject width/eot image/svg+xml image/x-icon font/ttf font/otf;

    # Regras globais de segurança e rotas do WordPress
    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    # Processamento de arquivos PHP (FastCGI)
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        
        # Ajuste a versão do socket do PHP FPM de acordo com a instalada no seu servidor (ex: php8.1-fpm, php8.2-fpm, php8.3-fpm)
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
        
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Cache de arquivos estáticos por longo período
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|otf)$ {
        expires max;
        log_not_found off;
    }

    # Bloquear acesso a arquivos ocultos (como .htaccess e .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Otimização de segurança para o arquivo de configuração do WordPress
    location = /wp-config.php {
        deny all;
        access_log off;
        log_not_found off;
    }
}
