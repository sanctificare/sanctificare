apply plugin: 'com.android.application'

android {
    namespace = "com.sanctificare.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sanctificare.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 18
        versionName "1.0.16"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    def releaseStoreFile = providers.gradleProperty("SANCTIFICARE_STORE_FILE").orElse(providers.environmentVariable("SANCTIFICARE_STORE_FILE"))
    def releaseStorePassword = providers.gradleProperty("SANCTIFICARE_STORE_PASSWORD").orElse(providers.environmentVariable("SANCTIFICARE_STORE_PASSWORD"))
    def releaseKeyAlias = providers.gradleProperty("SANCTIFICARE_KEY_ALIAS").orElse(providers.environmentVariable("SANCTIFICARE_KEY_ALIAS"))
    def releaseKeyPassword = providers.gradleProperty("SANCTIFICARE_KEY_PASSWORD").orElse(providers.environmentVariable("SANCTIFICARE_KEY_PASSWORD"))
    def hasReleaseSigning = releaseStoreFile.isPresent() && releaseStorePassword.isPresent() && releaseKeyAlias.isPresent() && releaseKeyPassword.isPresent()

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile.get())
                storePassword releaseStorePassword.get()
                keyAlias releaseKeyAlias.get()
                keyPassword releaseKeyPassword.get()
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation 'com.onesignal:OneSignal:[5.0.0, 5.99.99]'
}

def pruneHeavyWebAssets = tasks.register('pruneHeavyWebAssets', Delete) {
    delete(
        'src/main/assets/public/audio/liturgia-diaria/11 de junho.mp3',
        'src/main/assets/public/audio/rosary/intro-terco.mp3',
        'src/main/assets/public/audio/rosary/salve rainha.mp3',
        'src/main/assets/public/audio/rosary/terco.jpeg',
        'src/main/assets/public/assets/lectio',
        'src/main/assets/public/assets/novenas',
        'src/main/assets/public/assets/composers'
    )
}

tasks.named('preBuild') {
    dependsOn(pruneHeavyWebAssets)
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
