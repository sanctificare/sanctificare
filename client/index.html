    <!-- Critical splash styling: applied instantly (before the bundled CSS) to
         avoid a white flash between the native splash screen and React. Matches
         the native windowSplashScreenBackground (#050B1E) for a seamless boot. -->
    <style>
      html, body { margin: 0; background-color: #050B1E; }
      #root { min-height: 100dvh; background-color: #050B1E; }
      #__boot_splash {
        position: fixed; inset: 0; z-index: 99999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        background-color: #050B1E; color: #fff;
        font-family: "Cinzel", serif;
      }
      #__boot_splash img {
        width: 96px; height: 96px; object-fit: contain;
        filter: drop-shadow(0 0 15px rgba(245, 158, 11, 0.2));
        animation: boot-pulse 2s ease-in-out infinite;
      }
      #__boot_splash .boot-title {
        margin-top: 24px; font-size: 1.75rem; font-weight: 700;
        letter-spacing: 0.2em; text-transform: uppercase;
        background: linear-gradient(to bottom, #fde68a, #fcd34d, #f59e0b);
        -webkit-background-clip: text; background-clip: text; color: transparent;
      }
      #__boot_splash .boot-hint {
        margin-top: 20px; font-family: "Cormorant Garamond", serif;
        font-size: 0.9rem; letter-spacing: 0.15em; color: rgba(253, 230, 138, 0.6);
        animation: boot-pulse 2s ease-in-out infinite;
      }
      @keyframes boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
  </head>
